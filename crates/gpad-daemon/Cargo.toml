[package]
name = "gpad-daemon"
version = "0.4.0"
edition = "2021"
description = "Daemon PC Gpad: terima paket pena via USB/ADB, suntikkan sebagai input ke OS"
license = "MIT"

[[bin]]
name = "gpad-daemon"
path = "src/main.rs"

[dependencies]
gpad-protocol = { path = "../gpad-protocol" }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8" }

# API injection Windows hanya dikompilasi di Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
tray-icon = "0.20"
