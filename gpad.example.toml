# gpad.example.toml — salin menjadi gpad.toml di folder yang sama dengan exe.
# Semua bagian opsional; yang tidak ditulis memakai default.

[general]
# Mode awal: "absolute" atau "relative"
mode = "absolute"

[absolute]
# Area pemetaan: "screen" (seluruh virtual screen) | "monitor:0" | "custom"
area = "screen"
# Jika area = "custom": persegi dalam piksel virtual screen
# x = 100
# y = 100
# w = 1600
# h = 900
# Kunci rasio aspek HP agar lingkaran tidak jadi elips
keep_aspect = true

[relative]
# Pengali gerak (1.0 = geser penuh HP = selebar area)
sensitivity = 1.0

[pressure]
# Kurva tekanan; env GPAD_PRESSURE_GAMMA menimpa nilai ini
gamma = 1.0

[switching]
# Tombol barrel saat sentuh = ganti mode
barrel_toggles_mode = true
# Pintasan global ganti mode ("" = mati)
hotkey = "ctrl+alt+g"

# Profil per aplikasi: diterapkan saat jendela foreground berganti.
# Hanya field yang ditulis yang dioverride.
[profile.photoshop]
process = "photoshop.exe"
mode = "absolute"

[profile.krita]
process = "krita.exe"
mode = "absolute"
sensitivity = 1.2
gamma = 1.4
