# Contoh gpad.toml (v0.5.0) — taruh di folder yang sama dengan gpad-daemon.exe
# atau %APPDATA%\Gpad\gpad.toml. Semua opsional; default di bawah.

[video]
fps = 30            # 1..60, target frame per detik mirror
bitrate_kbps = 3000 # 500..8000, kualitas vs beban USB

[pressure]
gamma = 1.0         # kurva tekanan; env GPAD_PRESSURE_GAMMA menimpa
